name: Build NinjaCam Release

on:
  workflow_dispatch:
  push:
    paths:
      - "NinjaCam_AIDE_Release_Full.zip"
      - ".github/workflows/build-release.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract NinjaCam ZIP
        run: |
          rm -rf project
          mkdir -p project
          unzip -o NinjaCam_AIDE_Release_Full.zip -d project

      - name: Find NinjaCam project
        run: |
          echo "Isi project:"
          find project -maxdepth 4 -type f | sort

      - name: Fix Android app Gradle
        run: |
          APP_DIR=$(find project -type f -name "AndroidManifest.xml" -exec dirname {} \; | head -n 1)

          if [ -z "$APP_DIR" ]; then
            echo "AndroidManifest.xml tidak ditemukan"
            exit 1
          fi

          MAIN_DIR="$APP_DIR"
          APP_DIR=$(dirname "$(dirname "$MAIN_DIR")")

          echo "Main dir: $MAIN_DIR"
          echo "App dir: $APP_DIR"

          cat > "$APP_DIR/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.ninjacam"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.ninjacam"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 7
                  versionName = "0.7.0"
              }

              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("debug")
                  }

                  getByName("debug") {
                      applicationIdSuffix = ".debug"
                      versionNameSuffix = "-debug"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-ktx:1.10.0")

              implementation("androidx.camera:camera-core:1.4.1")
              implementation("androidx.camera:camera-camera2:1.4.1")
              implementation("androidx.camera:camera-lifecycle:1.4.1")
              implementation("androidx.camera:camera-view:1.4.1")
              implementation("androidx.camera:camera-video:1.4.1")
          }
          EOF

      - name: Build Release APK
        run: |
          cd project/ninjacam_release
          gradle assembleRelease --no-daemon --stacktrace

      - name: Find APK
        run: |
          find project -type f -name "*.apk" -print

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NinjaCam-release
          path: project/**/build/outputs/apk/release/*.apk
